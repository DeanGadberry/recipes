<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gadberry Recipes</title>
<meta name="description" content="Gadberry Recipes — a searchable family recipe box, gathered from our table to yours.">

<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Gadberry Recipes">
<meta property="og:title" content="Gadberry Recipes">
<meta property="og:description" content="A searchable family recipe box — every recipe keeps only its ingredients, steps, and its source.">
<meta property="og:image" content="https://deangadberry.com/recipes/assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://deangadberry.com/recipes/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Gadberry Recipes">
<meta name="twitter:description" content="A searchable family recipe box — every recipe keeps only its ingredients, steps, and its source.">
<meta name="twitter:image" content="https://deangadberry.com/recipes/assets/img/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/prefs.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="index.html">
      <svg class="deco" aria-hidden="true"><use href="#icon-leaf"></use></svg>
      <span>
        <span class="brand-text">Gadberry Recipes</span>
        <span class="tagline">Gathered at our table</span>
      </span>
    </a>
    <nav>
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
        <svg class="icon" aria-hidden="true"><use href="#icon-moon"></use></svg>
      </button>
      <a href="request.html">
        <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
        Request a recipe
      </a>
    </nav>
  </div>
</header>

<svg class="divider" aria-hidden="true"><use href="#deco-divider"></use></svg>

<main class="container">
  <div class="toolbar">
    <div class="search-field">
      <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
      <input id="search-input" type="search" placeholder="Search recipes, ingredients, tags..." aria-label="Search recipes">
    </div>
    <div class="toolbar-controls">
      <button type="button" id="favorites-toggle" class="icon-btn" aria-label="Show favorites only" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#icon-heart-outline"></use></svg>
      </button>
      <select id="sort-select" aria-label="Sort recipes">
        <option value="newest">Newest</option>
        <option value="name">Name A-Z</option>
        <option value="quickest">Quickest</option>
        <option value="popular">Most cooked</option>
        <option value="least-popular">Least cooked</option>
      </select>
      <div id="view-toggle" class="view-toggle" role="group" aria-label="Layout">
        <button type="button" data-view="grid" class="active" aria-label="Grid view"><svg class="icon" aria-hidden="true"><use href="#icon-grid"></use></svg></button>
        <button type="button" data-view="list" aria-label="List view"><svg class="icon" aria-hidden="true"><use href="#icon-rows"></use></svg></button>
      </div>
    </div>
  </div>

  <div id="category-bar" class="category-bar"></div>

  <p id="result-count" class="result-count"></p>

  <div id="recipe-grid" class="recipe-grid"></div>

  <div id="empty-state" class="empty-state" hidden>
    <svg class="deco" aria-hidden="true"><use href="#deco-sprig"></use></svg>
    <h2 id="empty-state-heading">Nothing here yet</h2>
    <p id="empty-state-text">Nothing matches your search, or the box is still empty. <a href="request.html">Request a recipe</a> to get started.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <svg class="deco" aria-hidden="true"><use href="#deco-sprig"></use></svg>
    <p>Gadberry Recipes &mdash; every recipe keeps only its ingredients, steps, and its source.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/theme-toggle.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/card.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
